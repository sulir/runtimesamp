plugins {
    id 'org.jetbrains.intellij' version '1.17.3'
}

intellij {
    version = '2019.2.4'
    plugins = ['java']
    buildSearchableOptions.enabled = false
}

patchPluginXml {
    changeNotes = 'This is an early alpha version.'
}

buildPlugin {
    destinationDirectory = project.file('../dist')
}

clean {
    delete buildPlugin.archiveFile
}
