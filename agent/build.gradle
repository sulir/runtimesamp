dependencies {
    implementation 'org.mutabilitydetector:asm-nonclassloadingextensions:1.0-rc1'
    implementation 'org.jetbrains:annotations:15.0'
}

jar {
    manifest {
        attributes(
            'Premain-Class': 'com.github.sulir.runtimesamp.agent.SampAgent',
            'Boot-Class-Path': archiveFileName
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    destinationDirectory = project.file('../dist')
}

clean {
    delete jar.archiveFile
}
